<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
<rect x="0" y="0" width="1240" height="1754" fill="#FAF6EF" />
<rect x="56.0" y="28.0" width="1128.0" height="4.0" fill="#141414" />
<text x="620.0" y="182.0" font-family="serif-bold" font-size="132" fill="#141414" text-anchor="middle">THE COMEBACK</text>
<rect x="56.0" y="202.0" width="1128.0" height="5.0" fill="#141414" />
<rect x="56.0" y="212.0" width="1128.0" height="2.0" fill="#141414" />
<text x="56.0" y="250.0" font-family="sans-bold" font-size="25" fill="#141414" text-anchor="start">Tuesday 24 November 2026</text>
<text x="1184.0" y="250.0" font-family="sans-bold" font-size="25" fill="#141414" text-anchor="end">NINE STORIES FROM AROUND THE GLOBE</text>
<rect x="56.0" y="268.0" width="1128.0" height="2.0" fill="#141414" />
<rect x="56.0" y="284.0" width="26.0" height="26.0" fill="#9A1B1E" />
<text x="69.0" y="304.0" font-family="sans-bold" font-size="19" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="96.0" y="304.0" font-family="sans-bold" font-size="26" fill="#9A1B1E" text-anchor="start">TECHNOLOGY — MARKETS</text>
<text x="56.0" y="406.0" font-family="serif-bold" font-size="100" fill="#141414" text-anchor="start">HUANG IS BACK</text>
<text x="56.0" y="494.0" font-family="serif-bold" font-size="100" fill="#141414" text-anchor="start">AT NVIDIA</text>
<text x="56.0" y="551.0" font-family="serif-italic" font-size="32" fill="#141414" text-anchor="start">Jensen Huang returns as Nvidia chief executive 11 days after resigning, as shares surge</text>
<text x="56.0" y="586.0" font-family="serif-italic" font-size="32" fill="#141414" text-anchor="start">31% and the chipmaker's market value climbs back to $4.0T.</text>
<rect x="56.0" y="608.0" width="364.0" height="88.0" fill="#FFFFFF" stroke="#141414" stroke-width="2" />
<text x="238.0" y="660.0" font-family="sans-bold" font-size="48" fill="#141414" text-anchor="middle">+31%</text>
<text x="238.0" y="688.0" font-family="sans" font-size="21" fill="#555555" text-anchor="middle">SHARES ON HIS RETURN</text>
<rect x="438.0" y="608.0" width="364.0" height="88.0" fill="#FFFFFF" stroke="#141414" stroke-width="2" />
<text x="620.0" y="660.0" font-family="sans-bold" font-size="48" fill="#141414" text-anchor="middle">$4.0T</text>
<text x="620.0" y="688.0" font-family="sans" font-size="21" fill="#555555" text-anchor="middle">MARKET VALUE</text>
<rect x="820.0" y="608.0" width="364.0" height="88.0" fill="#FFFFFF" stroke="#141414" stroke-width="2" />
<text x="1002.0" y="660.0" font-family="sans-bold" font-size="48" fill="#141414" text-anchor="middle">11 DAYS</text>
<text x="1002.0" y="688.0" font-family="sans" font-size="21" fill="#555555" text-anchor="middle">OUT OF THE JOB</text>
<rect x="56.0" y="716.0" width="1128.0" height="3.0" fill="#141414" />
<rect x="56.0" y="722.0" width="26.0" height="26.0" fill="#9A1B1E" />
<text x="69.0" y="742.0" font-family="sans-bold" font-size="19" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="96.0" y="742.0" font-family="sans-bold" font-size="25" fill="#9A1B1E" text-anchor="start">JUSTICE — THE HAGUE</text>
<text x="56.0" y="802.0" font-family="serif-bold" font-size="50" fill="#141414" text-anchor="start">14 NATIONS BACK ICJ RULING</text>
<text x="56.0" y="838.0" font-family="serif" font-size="24" fill="#141414" text-anchor="start">Fourteen countries acknowledged the International Court of Justice ruling that Myanmar committed genocide</text>
<text x="56.0" y="866.0" font-family="serif" font-size="24" fill="#141414" text-anchor="start">against the Rohingya, urging compliance with the binding decision.</text>
<rect x="56.0" y="876.0" width="1128.0" height="2.0" fill="#141414" />
<rect x="56.0" y="878.0" width="26.0" height="26.0" fill="#9A1B1E" />
<text x="69.0" y="898.0" font-family="sans-bold" font-size="19" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="96.0" y="898.0" font-family="sans-bold" font-size="25" fill="#9A1B1E" text-anchor="start">CLIMATE — COP31, ANTALYA</text>
<text x="56.0" y="958.0" font-family="serif-bold" font-size="50" fill="#141414" text-anchor="start">CLIMATE TALKS END IN FAILURE</text>
<text x="56.0" y="994.0" font-family="serif" font-size="24" fill="#141414" text-anchor="start">Climate talks in Antalya collapsed on Sunday after the EU and others rejected a final deal as too weak on fossil</text>
<text x="56.0" y="1022.0" font-family="serif" font-size="24" fill="#141414" text-anchor="start">fuels. UN chief António Guterres called it "deeply disappointing."</text>
<rect x="56.0" y="1032.0" width="1128.0" height="2.0" fill="#141414" />
<rect x="56.0" y="1034.0" width="26.0" height="26.0" fill="#9A1B1E" />
<text x="69.0" y="1054.0" font-family="sans-bold" font-size="19" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="96.0" y="1054.0" font-family="sans-bold" font-size="25" fill="#9A1B1E" text-anchor="start">WAR — LIBYA</text>
<text x="56.0" y="1114.0" font-family="serif-bold" font-size="50" fill="#141414" text-anchor="start">UKRAINE SINKS RUSSIAN</text>
<text x="56.0" y="1162.0" font-family="serif-bold" font-size="50" fill="#141414" text-anchor="start">WARSHIP OFF LIBYA</text>
<text x="56.0" y="1198.0" font-family="serif" font-size="24" fill="#141414" text-anchor="start">Ukrainian sea drones sank the Russian corvette Merkury off Benghazi, Kyiv's first acknowledged strike in Libya.</text>
<text x="56.0" y="1226.0" font-family="serif" font-size="24" fill="#141414" text-anchor="start">Seven drones were used; a Ka-27 helicopter was destroyed.</text>
<rect x="56.0" y="1236.0" width="1128.0" height="2.0" fill="#141414" />
<rect x="56.0" y="1238.0" width="26.0" height="26.0" fill="#9A1B1E" />
<text x="69.0" y="1258.0" font-family="sans-bold" font-size="19" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="96.0" y="1258.0" font-family="sans-bold" font-size="21" fill="#9A1B1E" text-anchor="start">EARTH — NEPAL</text>
<text x="56.0" y="1296.0" font-family="serif-bold" font-size="30" fill="#141414" text-anchor="start">5.4 QUAKE SHAKES NEPAL</text>
<text x="56.0" y="1336.0" font-family="serif" font-size="20" fill="#141414" text-anchor="start">A 5.4 quake hit Nepal on Tuesday; tremors were felt across five</text>
<text x="56.0" y="1362.0" font-family="serif" font-size="20" fill="#141414" text-anchor="start">countries.</text>
<rect x="638.0" y="1238.0" width="26.0" height="26.0" fill="#9A1B1E" />
<text x="651.0" y="1258.0" font-family="sans-bold" font-size="19" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="678.0" y="1258.0" font-family="sans-bold" font-size="21" fill="#9A1B1E" text-anchor="start">CONFLICT — GAZA</text>
<text x="638.0" y="1296.0" font-family="serif-bold" font-size="30" fill="#141414" text-anchor="start">ISRAELI STRIKES KILL SIX IN GAZA</text>
<text x="638.0" y="1336.0" font-family="serif" font-size="20" fill="#141414" text-anchor="start">Israeli strikes killed at least six in Gaza on Tuesday, medics said,</text>
<text x="638.0" y="1362.0" font-family="serif" font-size="20" fill="#141414" text-anchor="start">despite the ceasefire.</text>
<rect x="56.0" y="1366.0" width="26.0" height="26.0" fill="#9A1B1E" />
<text x="69.0" y="1386.0" font-family="sans-bold" font-size="19" fill="#FFFFFF" text-anchor="middle">7</text>
<text x="96.0" y="1386.0" font-family="sans-bold" font-size="21" fill="#9A1B1E" text-anchor="start">DEFENCE — EUROPE</text>
<text x="56.0" y="1424.0" font-family="serif-bold" font-size="30" fill="#141414" text-anchor="start">AWACS TO POLAND</text>
<text x="56.0" y="1464.0" font-family="serif" font-size="20" fill="#141414" text-anchor="start">NATO sends AWACS aircraft to Poland after three Russian-made</text>
<text x="56.0" y="1490.0" font-family="serif" font-size="20" fill="#141414" text-anchor="start">missiles crossed its airspace.</text>
<rect x="638.0" y="1366.0" width="26.0" height="26.0" fill="#9A1B1E" />
<text x="651.0" y="1386.0" font-family="sans-bold" font-size="19" fill="#FFFFFF" text-anchor="middle">8</text>
<text x="678.0" y="1386.0" font-family="sans-bold" font-size="21" fill="#9A1B1E" text-anchor="start">ASIA — INDONESIA</text>
<text x="638.0" y="1424.0" font-family="serif-bold" font-size="30" fill="#141414" text-anchor="start">ASIA FACTORY FIRE KILLS 24</text>
<text x="638.0" y="1464.0" font-family="serif" font-size="20" fill="#141414" text-anchor="start">A factory fire in Indonesia kills 24 people, with about 30 still</text>
<text x="638.0" y="1490.0" font-family="serif" font-size="20" fill="#141414" text-anchor="start">unaccounted for.</text>
<line x1="620.0" y1="1252.0" x2="620.0" y2="1504.0" stroke="#555555" stroke-width="1" />
<rect x="56.0" y="1510.0" width="26.0" height="26.0" fill="#9A1B1E" />
<text x="69.0" y="1530.0" font-family="sans-bold" font-size="19" fill="#FFFFFF" text-anchor="middle">9</text>
<text x="96.0" y="1530.0" font-family="sans-bold" font-size="24" fill="#9A1B1E" text-anchor="start">SPACE — TIANGONG</text>
<text x="56.0" y="1584.0" font-family="serif-bold" font-size="40" fill="#141414" text-anchor="start">FIRST FOREIGNER BOUND FOR TIANGONG</text>
<text x="56.0" y="1614.0" font-family="serif" font-size="23" fill="#141414" text-anchor="start">China said on Tuesday that Pakistani pilot Muhammad Zeeshan Ali will become the first foreign national aboard its</text>
<text x="56.0" y="1640.0" font-family="serif" font-size="23" fill="#141414" text-anchor="start">Tiangong space station, launching on Shenzhou-24 on Wednesday with Tang Hongbo and Wu Yi.</text>
<rect x="56.0" y="1646.0" width="1128.0" height="42.0" fill="#141414" />
<text x="620.0" y="1675.0" font-family="sans-bold" font-size="22" fill="#FFFFFF" text-anchor="middle">MARKETS — NVIDIA +31% AS HUANG RETURNS · VALUE BACK NEAR $4.0T</text>
<rect x="56.0" y="1694.0" width="1128.0" height="2.0" fill="#141414" />
<text x="56.0" y="1724.0" font-family="sans-bold" font-size="20" fill="#141414" text-anchor="start">THE COMEBACK — Tuesday 24 November 2026</text>
</svg>
